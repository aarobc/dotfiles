- defaults:
    link:
      relink: true

- clean: ['~']

# ~/.vim and ~/.vimrc take precedence over ~/.config/vim (:help xdg-vimrc), and
# older revisions of this repo linked ~/.vim. Only symlinks are removed, so a
# real file or directory there is left alone for a human to deal with.
- shell:
    - command: 'for p in "$HOME/.vim" "$HOME/.vimrc"; do [ -L "$p" ] && rm -f "$p"; done; true'
      description: drop legacy ~/.vim links that would shadow ~/.config/vim

- link:
    # vim reads ~/.config/vim/vimrc only when neither ~/.vimrc nor ~/.vim/vimrc
    # exists (:help xdg-vimrc), so nothing may be linked into ~/.vim.
    ~/.config/vim:
      force: true
      path: vim

    ~/.config/nvim:
      force: true
      path: nvim

    ~/.config/fuzzel:
      force: true
      path: fuzzel

    ~/.config/hypr:
      force: true
      path: hypr

    ~/.tmux.conf:
      force: true
      path: tmux.conf

    ~/.zshrc:
      force: true
      path: zshrc

    ~/.profile:
      force: true
      path: profile

    ~/.config/environment.d/60-dotfiles.conf:
      force: true
      create: true
      path: environment

    ~/.config/i3status/config:
      force: true
      create: true
      path: i3status.conf

    ~/.config/i3:
      force: true
      path: i3

    ~/.Xmodmap:
      force: true
      path: Xmodmap

    ~/.config/sway:
      force: true
      path: sway

    ~/.config/waybar:
      force: true
      path: waybar

    ~/.config/foot/foot.ini:
      force: true
      create: true
      path: foot.ini
