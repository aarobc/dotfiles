[main]
# Fuzzel will fall back to your system default if you don't specify a font,
# but Nerd Fonts look great here.
font=monospace:size=13
prompt="❯ "
icon-theme=Papirus-Dark
lines=10
width=40
horizontal-pad=20
vertical-pad=15
inner-pad=5

[colors]
# Note: Fuzzel uses 8-character hex codes (rrggbbaa) for RGBA transparency.
# The last two characters dictate opacity (e.g., 'ee' is slightly transparent, 'ff' is solid).
background=1e1e2eee      # Dark gray with slight transparency
text=cdd6f4ff            # Soft white text
match=89b4faff           # Pastel blue for matching search characters
selection=313244ff       # Slightly lighter gray for the highlighted row
selection-text=cdd6f4ff
selection-match=89b4faff
border=89b4faff          # Pastel blue border

[border]
width=0
radius=10                # Smooth rounded corners
