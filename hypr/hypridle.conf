
general {
    lock_cmd = pidof hyprlock || hyprlock          # Command to lock the screen
    before_sleep_cmd = loginctl lock-session      # Lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on    # Turn screen on after resume
}

# --- Screen Lock ---
# Lock the screen after 5 minutes (300 seconds) of inactivity
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# --- Screen Timeout (DPMS) ---
# Turn off the screen (DPMS) after 10 minutes (600 seconds) of inactivity
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# --- System Suspend (Sleep) ---
# Suspend the system after 30 minutes (1800 seconds) of inactivity
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
